[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "courtside-roster-111210529"
version = "0.1.0"
description = "Validate, search, and filter COURTSIDE NBA roster data."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Jerry Chen" }]
license-files = ["LICENSE"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
