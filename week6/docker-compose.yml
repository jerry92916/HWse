services:
  # 1. Nginx 代理伺服器 (對外開放 Port 80)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
    networks:
      - micro-network

  # 2. 前端服務 (不直接對外開放 Port，由 Nginx 轉交)
  frontend:
    build: ./frontend
    depends_on:
      - backend
    networks:
      - micro-network

  # 3. 後端服務 (新增 ports 開放 8000，方便開發時直接測試 API)
  backend:
    build: ./backend
    ports:
      - "8000:8000"  # 讓你的瀏覽器可以直接連上後端
    environment:
      - DB_HOST=db
      - DB_USER=myuser
      - DB_PASSWORD=mypassword
      - DB_NAME=mydb
    depends_on:
      - db
    networks:
      - micro-network

  # 4. PostgreSQL 資料庫
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - micro-network

networks:
  micro-network:
    driver: bridge

# 建立持久化儲存空間，避免資料庫重啟後資料不見
volumes:
  postgres_data: