events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # 將所有來自大門的請求，都轉發給內部的 frontend 服務 (Port 5000)
        location / {
            proxy_pass http://frontend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}